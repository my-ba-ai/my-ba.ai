name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `next build` prerenders pages wrapped in <ClerkProvider>, which throws
      # without a publishable key. Values live in repository variables
      # (Settings → Secrets and variables → Actions → Variables), never in the
      # repo. Turbo forwards them to the build task via turbo.json `build.env`.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Fail in one second with the fix, not after install + typecheck + tests
      # with a Next prerender stack trace.
      - name: Check required CI variables
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # P0-8: gitleaks over the PR's commits (full history on push to main), with
  # the committed .gitleaks.toml. The CLI, not gitleaks/gitleaks-action: the
  # action needs a GITLEAKS_LICENSE for organisation-owned repos. Findings are
  # redacted in the log and in the uploaded report.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the GitHub release. Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # PRs: only the commits the PR adds (base..head). Push to main: everything.
      # SHAs go through env, never interpolated into the script.
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks version
          if [ -n "$BASE_SHA" ]; then
            set -- --log-opts="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning PR commits ${BASE_SHA}..${HEAD_SHA}"
          else
            echo "Scanning full history"
          fi
          gitleaks git . "$@" --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # P0-7: the P0-5 durability suite (pause → SIGKILL → resume from checkpoint)
  # against a real Postgres, so a @langchain/* bump, a PostgresSaver schema change
  # or a lost grant on langgraph.* can't merge unnoticed.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Local docker-compose credentials only (the allowed literals in AGENTS.md).
      # The suite runs as my_ba_app so RLS and grants apply exactly as in dev.
      DATABASE_URL: postgresql://my_ba_app:app@localhost:5432/my_ba
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/my_ba
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The suite imports @my-ba/db from dist; `...` builds its dependencies too.
      - name: Build orchestrator and dependencies
        run: pnpm turbo run build --filter=@my-ba/orchestrator...

      # Own step so its duration shows up on its own in the run summary. The
      # timescaledb-ha image is multi-GB; see the P0-7 watch item before swapping it.
      - name: Pull Postgres image
        run: docker compose pull postgres

      # docker compose, not a `services:` container: the my_ba_app role comes from
      # infra/postgres/init via docker-entrypoint-initdb.d, which needs the checkout
      # mounted. Redis isn't needed, so only postgres is started.
      - name: Start Postgres
        run: pnpm db:up postgres

      # Does two things. (1) Readiness: on a fresh volume the init scripts may run
      # on a temporary server before the real one listens on TCP, so a
      # healthy container doesn't yet prove my_ba_app can log in over TCP. Retry
      # until it can. (2) A superuser or BYPASSRLS role would let the suite pass
      # regardless of grants and policies, so fail loudly if the app role is one.
      - name: Wait for app role and assert it is not privileged
        run: |
          for i in $(seq 1 30); do
            if flags=$(docker compose exec -T postgres psql "$DATABASE_URL" -tAc \
              "SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          echo "rolsuper|rolbypassrls = ${flags:-<no connection>}"
          if [ "${flags:-}" != "f|f" ]; then
            echo "::error::DATABASE_URL must connect as a NOSUPERUSER NOBYPASSRLS role (got '${flags:-no connection}')."
            exit 1
          fi

      # Drizzle journal from an empty database (through 0009_langgraph_schema),
      # then checkpointer:setup. Also the only proof migrations work from scratch.
      - name: Migrate
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Collect Postgres logs
        if: failure()
        run: docker compose logs postgres > postgres.log 2>&1 || true

      - name: Upload Postgres logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-logs
          path: postgres.log
          if-no-files-found: ignore
