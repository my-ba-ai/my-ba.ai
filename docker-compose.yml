# Local development infrastructure (Postgres: P0-2, Redis: P0-4).
#
# timescale/timescaledb-ha ships TimescaleDB *and* pgvector in one image, which
# is what D24 asks for: a single Postgres instance, not three services.
#
#   docker compose up -d
#   pnpm db:migrate
services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: my-ba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_ba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The app role's password. The app connects as my_ba_app, never as
      # postgres, because superusers bypass RLS unconditionally (D26).
      APP_DB_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      # Creates the my_ba_app role on first boot of an empty volume (packages/db).
      - ./packages/db/sql/postgres-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_ba"]
      interval: 5s
      timeout: 5s
      retries: 20

  # BullMQ queues and the auth identity cache (P0-4).
  #
  # maxmemory-policy must be noeviction: under any eviction policy Redis may
  # drop queue keys under memory pressure and jobs disappear without an error.
  # AOF is on so queued jobs survive `docker compose restart`.
  redis:
    image: redis:7.4-alpine
    container_name: my-ba-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional database browser. Not started by `pnpm db:up`: opt in with
  # `pnpm db:admin`, then open http://localhost:5050.
  #
  # Desktop mode (SERVER_MODE False): no pgAdmin login and no master password,
  # so it is bound to 127.0.0.1 only. Both connections in
  # packages/db/pgadmin-servers.json are pre-registered on first start, without
  # passwords: pgAdmin asks on first connect (postgres / app, as above) and
  # can remember them in its own volume. The image refuses to start without
  # a default email and password even in desktop mode; neither is used to log
  # in to anything.
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: my-ba-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: unused-in-desktop-mode
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./packages/db/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
